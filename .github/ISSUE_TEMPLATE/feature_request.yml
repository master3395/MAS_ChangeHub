name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Feature requests for archive, Contabo, Discord, or operator UX are welcome.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Internet Archive snapshots
        - Contabo VPS snapshots
        - Discord / notifications
        - menu.sh / CLI
        - Documentation / guides
        - GitHub / CI / Pages
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: false

  - type: checkboxes
    id: volunteer
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature
          required: false
